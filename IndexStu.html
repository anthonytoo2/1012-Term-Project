<!DOCTYPE html>
<html>
    <head>
        <meta charset = "utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <link rel = "stylesheet" href = "style.css">
        <script src = "TermProject.js"> </script>
        <title>
            Student Home Page
        </title>
    </head>

    <body onload="display()">
        <div class = "pageTop">
            <div class = "points">
                <p id="displayValue"></p>
            </div>
            <div class = "datesPage">
                <button class="button" onclick="planner()"> To-do</button> 
             </div>
             <div class = "shopPage">
                <button class="button" onclick="shop()"> Shop </button> 
             </div>
        </div>
        <hr>
                <div class = "timer">
                    <p class = "indexChoice">Study Session</p>
                    <button class="taskSelect" onclick="timer()"><img src = "timer.png" alt = timer> </button>
                </div>
                
                <div class = "homework">
                <p class = "indexChoice">Homework</p> 
                <button class="taskSelect" onclick="homework()"><img src = "paper.png" alt = homework> </button>
                </div>
    </body>
</html>
