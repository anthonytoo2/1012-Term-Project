<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Focus Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="login-page" class="container">
        <h2>Student Login Information</h2>
        <p>Please enter your credentials.</p>
        <input type="text" id="student-id" placeholder="Student ID">
        <input type="password" id="password" placeholder="Password">
        <br>
        <button onclick="attemptLogin()">Login</button>
        <p id="error-msg" style="color: red; display: none;">Try again! Invalid ID or Password.</p>
    </div>

    <div id="dashboard" class="container hidden">
        <h2>Welcome, <span id="username-display">Student</span>!</h2>
        
        <div style="border-bottom: 1px solid #eee; padding-bottom: 20px;">
            <h3>1. Set Your Daily Goal</h3>
            <label>I want to study for:</label>
            <input type="number" id="goal-input" placeholder="Hours" style="width: 60px;"> hours
            <button onclick="setGoal()">Set Goal</button>
        </div>

        <div style="border-bottom: 1px solid #eee; padding-bottom: 20px;">
            <h3>2. Study Timer</h3>
            <div id="timer-display">00:00:00</div>
            <button id="start-btn" onclick="startTimer()">Start Studying</button>
            <button id="stop-btn" class="stop hidden" onclick="stopTimer()">Stop & Save</button>
        </div>

        <div class="progress-section">
            <h3>3. Productivity Trends</h3>
            <p>Daily Progress: <span id="progress-text">0%</span></p>
            <div class="progress-bar-bg">
                <div id="progress-fill" class="progress-bar-fill"></div>
            </div>
            <p><small>Total Time Studied Today: <span id="total-time">0</span> mins</small></p>
        </div>
        
        <br>
        <button onclick="logout()" style="background-color: #6c757d;">Logout</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
