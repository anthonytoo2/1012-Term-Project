<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Student Task Checklist</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="container">
    <h2>Task Checklist</h2>

    <div class="add-row">
        <input id="task-input" type="text" placeholder="Enter a task" />
        <button onclick="addTask()">Add Task</button>
    </div>

    <p id="task-count">No tasks yet.</p>

    <ul id="task-list" aria-live="polite"></ul>

    <br />
    <a href="index.html"><button>Back to Dashboard</button></a>
</div>

<script src="tasks.js"></script>
</body>
</html>
