<!DOCTYPE html>
<html>

        <link rel = "stylesheet" href = "style.css">
        <script src = "TermProject.js"> </script>
        <script src = "task.js"></script>
        <title>

        </title>

    <body onload="showMe()">

                <img id="buddyPFP" src="" alt="Your chosen buddy image">
