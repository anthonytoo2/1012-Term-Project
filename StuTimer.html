<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="CSS_Stuff/style.css" />
  <link rel="stylesheet" href = "CSS_Stuff/timer.css">
  <script src = "JavaScript/TermProject.js"> </script>
  <script src="JavaScript/timer.js" defer></script>
  <title>Time to Study!</title>
</head>
        
    <body onload="showMe()">
         <div class = "pageTop">
            <div class = "PFP">
                <img id="buddyPFP" src="" alt="Your chosen buddy image">
            </div>
             <div class = userName>  <div id="name"></div>
            </div>
          
             <div class = "shopPage">
                <button class="button" onclick="shop()"> Shop </button> 
             </div>
        </div>
        <hr>

  <div class="container">
    <div class="page">
      <div class="card">
        <h1>Study Timer</h1>
        <div style="text-align: center; margin: 12px 0;">
          <label>Study Time (min): </label>
          <input type="number" id="study-time" value="25" min="5" max="480"/>
          <label id = "breakText">Break Time (min): </label>
          <input type="number" id="break-time" value="5" min="1" max="60" />
        </div>

        <div class="timer-display" id="timer">25:00</div>

        <div class="controls">
          <button class="btn btn-primary" id="start-btn">Start</button>
          <button class="btn btn-warning" id="pause-btn" disabled>Pause</button>
          <button class="btn btn-danger" id="reset-btn">Reset</button>
        </div>

        <div class="break-message" id="break-message">
          <h3>Break Time!</h3>
          <p>Your study buddy is sleeping. Resume in <span id="break-timer">05:00</span></p>
        </div>
      </div>

      <div class="card">
        <h3>Points!</h3>
        <div class="points-display" id="points">0 Points</div>
        <p>You earn 1 point for every minute!</p>

        <div class="today-progress">
          <label>Progress: </label>
          <div class="progress-bar-bg" aria-hidden="true">
            <div id="progress-fill" class="progress-fill"></div>
          </div>
          <div class="progress-meta">
            <div>Points: <span id="points-meta">0</span></div>
            <div id="progress-text">0%</div>
          </div>
        </div>

      </div>
    </div>

    <div>
      <button class="button" id="reward-btn" onclick="studyVideo()">Time for a reward!</button>
    </div>
  </div>
        <div class = "homeButtonFormat">
            <button class="button" onclick="home()"> Home </button>
        </div>
</body>
</html>
