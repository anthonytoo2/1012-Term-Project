<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="style.css" />
  <script src = "TermProject.js"> </script>
  <title>Time to Study!</title>

  <!-- Minimal, scoped styles that should not override your main stylesheet -->
  <style>
    /* Scoped container style (won't aggressively override other rules) */
    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 20px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.04);
      background: #ffffffcc;
      border-radius: 10px;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
    }


   
    /* Buttons (non-intrusive) */
    .btn {
      cursor: pointer;
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid #222;
      background: #f2f2f2;
      font-weight: 600;
    }
    .btn-primary { background: #2b7cff; color: white; border: none; }
    .btn-warning { background: #f6c85f; color: black; border: none; }
    .btn-danger { background: #ff6b6b; color: white; border: none; }

    /* Card look */
    .card {
      padding: 14px;
      margin-top: 14px;
      border-radius: 10px;
      background: #fafafa;
      border: 1px solid rgba(0,0,0,0.04);
    }

    /* Timer display */
    .timer-display {
      font-size: 2rem;
      text-align: center;
      margin: 8px 0 12px;
      font-weight: 700;
    }
    .controls {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin-bottom: 12px;
    }

    /* Break message */
    .break-message h3 { margin: 0; }
    .break-message p { margin: 6px 0 0; }

    /* Points */
    .points-display { font-weight: 700; font-size: 1.1rem; text-align:center; }

    /* TODAY progress bar */
    .today-progress {
      margin-top: 14px;
      display: grid;
      gap: 6px;
    }
    .today-progress label {
      font-weight: 600;
      font-size: 0.95rem;
    }
    .progress-bar-bg {
      width: 100%;
      height: 18px;
      background: linear-gradient(180deg, #eee, #f7f7f7);
      border-radius: 999px;
      border: 1px solid rgba(0,0,0,0.06);
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      border-radius: 999px;
      transition: width 400ms ease;
      background: linear-gradient(90deg, #7ad, #3b8cff);
    }
    .progress-meta {
      display:flex;
      justify-content: space-between;
      font-size: 0.9rem;
      color: #444;
    }

    /* small responsive tweaks */
    @media (max-width:520px){
      .pageTop { gap: 8px; }
      .timer-display { font-size: 1.6rem; }
      .controls { flex-wrap: wrap; }
    }
  </style>
</head>
        
    <body onload="showMe()">
         <div class = "pageTop">
            <div class = "PFP">
                <img id="buddyPFP" src="" alt="Your chosen buddy image">
            </div>
             <div class = userName>  <div id="name"></div>
            </div>
          
             <div class = "shopPage">
                <button class="button" onclick="shop()"> Shop </button> 
             </div>
        </div>
        <hr>
        <div class = "homeButtonFormat">
            <button class="button" onclick="home()"> Home </button>
        </div>

  <div class="container">
    <!-- Anthony's Features -->
    <div id="anthony" class="page">
      <button class="back-btn" data-back="dashboard" onclick="home()">Back</button>

      <div class="card">
        <h1>Study Timer</h1>
        <div style="text-align: center; margin: 12px 0;">
          <label>Study Time (min): </label>
          <input type="number" id="study-time" value="25" min="5" max="480" style="width: 68px; padding:6px;" />
          <label style="margin-left: 12px;">Break Time (min): </label>
          <input type="number" id="break-time" value="5" min="1" max="60" style="width: 68px; padding:6px;" />
        </div>

        <div class="timer-display" id="timer">25:00</div>

        <div class="controls">
          <button class="btn btn-primary" id="start-btn">Start</button>
          <button class="btn btn-warning" id="pause-btn" disabled>Pause</button>
          <button class="btn btn-danger" id="reset-btn">Reset</button>
        </div>

        <div class="break-message" id="break-message" style="display:none; text-align:center;">
          <h3>Break Time!</h3>
          <p>Your study buddy is sleeping. Resume in <span id="break-timer">05:00</span></p>
        </div>
      </div>

      <div class="card">
        <h3>Reward System</h3>
        <div class="points-display" id="points">0 Points</div>
        <p style="font-size:0.95rem; margin-top:8px;">You earn 1 point for every full minute of focused study!</p>

        <div class="today-progress">
          <label>Today's Progress</label>
          <div class="progress-bar-bg" aria-hidden="true">
            <div id="progress-fill" class="progress-fill"></div>
          </div>
          <div class="progress-meta">
            <div>Points: <span id="points-meta">0</span></div>
            <div id="progress-text">0%</div>
          </div>

  
        </div>

      </div>
    </div>

    <div style="text-align:center; margin-top:14px;">
      <button class="button" id="reward-btn" onclick="studyVideo()">Time for a reward!</button>
    </div>
  </div>

  <!-- Link to external JS -->
  <script src="timer.js"></script>
</body>
</html>
