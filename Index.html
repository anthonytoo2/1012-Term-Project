<!DOCTYPE html>
<html>
    <head>
        <meta charset = "utf-8">
        <link rel="stylesheet" href = "style.css">
        <script src = "TermProject.js"></script>
        <title>
            Buddy Selection
        </title>
    </head>

    <body onload="setBuddy(); buddyImage();">
        <div class="buddyBody">
            <div class="BuddySelections">
                <div class="Selector">
                    <label for="buddy">Choose a buddy</label>
                    <select id="value">
                        <option value="buddy1">buddy 1</option>
                        <option value="buddy2">buddy 2</option>
                        <option value="buddy3">buddy 3</option>
                    </select>
                </div>
                <div class="nameInput">
                    <p>
                        <label for="buddyName">Whats the name of your buddy?</label>
                        <br>
                        <input type="text" id="input">
                    </p>
                    <p><button id="submit">Choose</button></p>
                    <p id="output"></p>
                </div>
            </div>
            <div class="display">
                <img src="Empty.png" id="chooseBuddy" alt="Simply where your buddy will be.">
            </div>
        </div>
    </body>
</html>
